version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: geoadmin
      POSTGRES_PASSWORD: geoanalyzer_dev_pw
      POSTGRES_DB: geo_analyzer
    ports:
      - "5432:5432"
    volumes:
      - geo_analyzer_pgdata:/var/lib/postgresql/data

volumes:
  geo_analyzer_pgdata:
